<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Project Untitled</title>


    <!-- =================================================
         CSS
    ================================================== -->

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/desktop.css">
    <link rel="stylesheet" href="css/windows.css">
    <link rel="stylesheet" href="css/taskbar.css">
    <link rel="stylesheet" href="css/browser.css">
    <link rel="stylesheet" href="css/explorer.css">
    <link rel="stylesheet" href="css/notepad.css">
    <link rel="stylesheet" href="css/sites.css">

</head>


<body>


    <!-- =================================================
         BOOT SCREEN
    ================================================== -->

    <div id="bootScreen">

        <div class="boot-content">

            <div class="boot-logo">
                UNTITLED OS
            </div>

            <div class="boot-text">
                Starting system...
            </div>

            <div class="boot-progress">

                <div id="bootProgress"></div>

            </div>

            <div
                id="bootStatus"
                class="boot-status"
            >
                Initializing...
            </div>

        </div>

    </div>


    <!-- =================================================
         DESKTOP
    ================================================== -->

    <main id="desktop">


        <!-- =================================================
             DESKTOP ICONS
        ================================================== -->

        <div
            class="desktop-icon"
            id="filesIcon"
            data-app="files"
        >

            <div class="icon-image">
                📁
            </div>

            <span>
                My Files
            </span>

        </div>


        <div
            class="desktop-icon"
            id="browserIcon"
            data-app="browser"
        >

            <div class="icon-image">
                🌐
            </div>

            <span>
                Internet
            </span>

        </div>


        <div
            class="desktop-icon"
            id="mailIcon"
            data-app="mail"
        >

            <div class="icon-image">
                ✉️
            </div>

            <span>
                Mail
            </span>

        </div>


        <div
            class="desktop-icon"
            id="notepadIcon"
            data-app="notepad"
        >

            <div class="icon-image">
                📝
            </div>

            <span>
                Notepad
            </span>

        </div>



        <!-- =================================================
             FILE EXPLORER
        ================================================== -->

        <section
            id="explorerWindow"
            class="window"
        >

            <div class="window-titlebar">

                <span>
                    My Files
                </span>

                <div class="window-buttons">

                    <button
                        class="window-minimize"
                        title="Minimize"
                    >
                        _
                    </button>

                    <button
                        class="window-maximize"
                        title="Maximize"
                    >
                        □
                    </button>

                    <button
                        class="window-close"
                        title="Close"
                    >
                        ×
                    </button>

                </div>

            </div>


            <div class="window-content">

                <div class="explorer-toolbar">

                    <button id="explorerBack">
                        Back
                    </button>

                    <button id="explorerForward">
                        Forward
                    </button>

                    <button id="explorerUp">
                        Up
                    </button>


                    <div
                        id="pathDisplay"
                        class="path-display"
                    >
                        C:\
                    </div>

                </div>


                <div
                    id="fileGrid"
                    class="file-grid"
                >
                    <!-- Files generated by explorer.js -->
                </div>

            </div>

        </section>



        <!-- =================================================
             BROWSER
        ================================================== -->

        <section
            id="browserWindow"
            class="window browser-window"
        >

            <div class="window-titlebar">

                <span>
                    Internet Explorer
                </span>

                <div class="window-buttons">

                    <button
                        class="window-minimize"
                        title="Minimize"
                    >
                        _
                    </button>

                    <button
                        class="window-maximize"
                        title="Maximize"
                    >
                        □
                    </button>

                    <button
                        class="window-close"
                        title="Close"
                    >
                        ×
                    </button>

                </div>

            </div>


            <div class="browser-toolbar">

                <button
                    id="browserBack"
                    title="Back"
                >
                    ◀
                </button>

                <button
                    id="browserForward"
                    title="Forward"
                >
                    ▶
                </button>

                <button
                    id="browserRefresh"
                    title="Refresh"
                >
                    ↻
                </button>

                <button
                    id="browserHome"
                    title="Home"
                >
                    🏠
                </button>


                <input
                    id="browserAddress"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Enter address..."
                >


                <button id="browserGo">
                    Go
                </button>

            </div>


            <div
                id="browserPage"
                class="browser-page"
            >
                <!-- Website content generated by browser.js -->
            </div>

        </section>



        <!-- =================================================
             BROWSER HISTORY
        ================================================== -->

        <section
            id="historyWindow"
            class="window browser-history-window"
        >

            <div class="window-titlebar">

                <span>
                    Browser History
                </span>

                <div class="window-buttons">

                    <button
                        class="window-minimize"
                        title="Minimize"
                    >
                        _
                    </button>

                    <button
                        class="window-maximize"
                        title="Maximize"
                    >
                        □
                    </button>

                    <button
                        class="window-close"
                        title="Close"
                    >
                        ×
                    </button>

                </div>

            </div>


            <div class="history-toolbar">

                <button id="clearHistory">
                    Clear History
                </button>

                <span id="historyCount">
                    0 entries
                </span>

            </div>


            <div
                id="browserHistoryList"
                class="browser-history-list"
            >
                <!-- History generated by history.js -->
            </div>

        </section>


        <!-- =================================================
             MAIL
        ================================================== -->

        <section
            id="mailWindow"
            class="window"
        >

            <div class="window-titlebar">

                <span>
                    Inbox
                </span>

                <div class="window-buttons">

                    <button
                        class="window-minimize"
                        title="Minimize"
                    >
                        _
                    </button>

                    <button
                        class="window-maximize"
                        title="Maximize"
                    >
                        □
                    </button>

                    <button
                        class="window-close"
                        title="Close"
                    >
                        ×
                    </button>

                </div>

            </div>


            <div class="window-content">

                <div
                    id="emailList"
                    class="email-list"
                >
                    <!-- Emails generated by mail.js -->
                </div>

            </div>

        </section>



        <!-- =================================================
             NOTEPAD
        ================================================== -->

        <section
            id="notepadWindow"
            class="window notepad-window"
        >

            <div class="window-titlebar">

                <span>
                    Notepad
                </span>

                <div class="window-buttons">

                    <button
                        class="window-minimize"
                        title="Minimize"
                    >
                        _
                    </button>

                    <button
                        class="window-maximize"
                        title="Maximize"
                    >
                        □
                    </button>

                    <button
                        class="window-close"
                        title="Close"
                    >
                        ×
                    </button>

                </div>

            </div>


            <div class="notepad-toolbar">

                <button id="newNote">
                    New
                </button>

                <button id="saveNote">
                    Save
                </button>

                <button id="deleteNote">
                    Delete
                </button>


                <span
                    id="notepadStatus"
                    class="notepad-status"
                >
                    Ready
                </span>

            </div>


            <div class="notepad-main">


                <aside class="notepad-files">

                    <div class="notepad-files-title">
                        Notes
                    </div>


                    <div id="noteList">
                        <!-- Notes generated by notepad.js -->
                    </div>

                </aside>



                <div class="notepad-editor">

                    <input
                        id="noteTitle"
                        type="text"
                        placeholder="Untitled"
                        autocomplete="off"
                    >


                    <textarea
                        id="notepadText"
                        placeholder="Start typing..."
                    ></textarea>

                </div>

            </div>

        </section>



        <!-- =================================================
             TASKBAR
        ================================================== -->

        <div id="taskbar">


            <button id="startButton">

                <strong>
                    ▣
                </strong>

                Start

            </button>


            <div id="taskbarWindows">
                <!-- Running applications added by taskbar.js -->
            </div>


            <div id="clock">
                00:00
            </div>

        </div>



        <!-- =================================================
             START MENU
        ================================================== -->

        <div id="startMenu">


            <div class="start-header">
                UNTITLED OS
            </div>


            <div
                class="start-item"
                data-app="files"
            >
                📁 My Files
            </div>


            <div
                class="start-item"
                data-app="browser"
            >
                🌐 Internet
            </div>


            <div
                class="start-item"
                data-app="mail"
            >
                ✉️ Mail
            </div>


            <div
                class="start-item"
                data-app="notepad"
            >
                📝 Notepad
            </div>


            <hr>


            <div
                class="start-item"
                data-app="history"
            >
                🕘 Browser History
            </div>


            <hr>


            <div
                id="shutdownButton"
                class="start-item"
            >
                ⏻ Shut Down
            </div>

        </div>


    </main>



    <!-- =================================================
         JAVASCRIPT
    ================================================== -->


    <!-- =================================================
         DATA
    ================================================== -->

    <script src="js/data/emails.js"></script>
    <script src="js/data/files.js"></script>
    <script src="js/data/notes.js"></script>
    <script src="js/data/websites.js"></script>


    <!-- =================================================
         SYSTEM
    ================================================== -->

    <script src="js/system/sound.js"></script>
    <script src="js/system/clock.js"></script>
    <script src="js/system/desktop.js"></script>
    <script src="js/system/boot.js"></script>


    <!-- =================================================
         WINDOWS
    ================================================== -->

    <script src="js/windows/windowManager.js"></script>
    <script src="js/windows/draggable.js"></script>
    <script src="js/windows/taskbar.js"></script>


    <!-- =================================================
         APPS
    ================================================== -->

    <script src="js/apps/explorer.js"></script>
    <script src="js/apps/browser.js"></script>
    <script src="js/apps/history.js"></script>
    <script src="js/apps/mail.js"></script>
    <script src="js/apps/notepad.js"></script>


    <!-- =================================================
         GAME
    ================================================== -->

    <script src="js/game/clues.js"></script>
    <script src="js/game/investigation.js"></script>
    <script src="js/game/progression.js"></script>


    <!-- =================================================
         MAIN
    ================================================== -->

    <script src="js/main.js"></script>


</body>

</html>
